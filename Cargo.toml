[package]
name = "rabta"
version = "0.0.1"
edition = "2024"
description = "Self-hosted relay for signed events and files with decentralized peer-mesh sync."
repository = "https://github.com/rabta-protocol/rabta"
homepage = "https://github.com/rabta-protocol/rabta"
keywords = ["self-hosted", "decentralized", "sync", "relay", "sqlite"]
categories = ["web-programming::http-server", "database-implementations"]

[dependencies]
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 2
strip = true
