name: dev

on:
  workflow_dispatch:

concurrency:
  group: dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-push:
    name: docker-${{ matrix.arch }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dev-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-docker-${{ matrix.arch }}
          provenance: false

      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dev-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error

  merge:
    name: docker-merge
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge platform manifests
        run: |
          set -euo pipefail
          AMD64="$REGISTRY/$IMAGE_NAME@$(cat digests/amd64)"
          ARM64="$REGISTRY/$IMAGE_NAME@$(cat digests/arm64)"
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE_NAME:dev" \
            "$AMD64" "$ARM64"
          docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:dev"
